[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laserorm"
version = "0.3.0"
description = "A minimalistic async-first ORM: one model, many databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sqlite = [
    "aiosqlite>=0.21.0",
]
postgres = [
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.11",
]
mysql = [
    "aiomysql>=0.2.0",
    # MySQL 8 defaults to caching_sha2_password, which pymysql cannot do without it
    "cryptography>=42.0",
]

[dependency-groups]
dev = [
    "ruff",
    "black",
    "pytest>=8.4.2",
    "pytest-cov>=6.3.0",
    "pytest-asyncio>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["laserorm*"]
exclude = ["tests*"]
